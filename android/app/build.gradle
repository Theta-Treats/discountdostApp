apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {

  autolinkLibrariesWithApp()

}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.discountdost"

    packaging {
        jniLibs {
            // This prevents the system from compressing libs, allowing 16KB alignment
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        applicationId "com.discountdost"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 32
        versionName "1.3.1"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++20", "-fexceptions", "-frtti", "-include", "${projectDir}/src/main/jni/format_fix.h"
                
                // CHANGE c++_shared to c++_static HERE
                arguments "-DANDROID_STL=c++_shared", 
                        "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,common-page-size=16384 -Wl,-z,max-page-size=16384"
            }
        }
    }

    signingConfigs {
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

// AT THE VERY END OF YOUR build.gradle
tasks.configureEach { task ->
    if (task.name.contains("merge") && task.name.contains("NativeLibs")) {
        task.doLast {
            def nativeDir = task.outputDir.get().asFile
            def ndkDir = android.ndkDirectory
            // Determine the correct tool path (Windows)
            def objcopy = "${ndkDir}/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-objcopy"
            
            fileTree(nativeDir).filter { it.name.endsWith('.so') }.each { soFile ->
                println "RE-ALIGNING ELF SEGMENTS: ${soFile.name}"
                try {
                    exec {
                        // This specific flag tells the tool to treat the file as having 16KB pages
                        commandLine objcopy, "--set-section-alignment", ".text=16384", soFile.absolutePath
                    }
                    exec {
                        // This forces the load alignment in the program headers
                        commandLine objcopy, "-p", "--set-section-alignment", ".data=16384", soFile.absolutePath
                    }
                } catch (Exception e) {
                    println "Failed to process ${soFile.name}: ${e.message}"
                }
            }
        }
    }
}