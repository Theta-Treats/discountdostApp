buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.0.12077973"
        kotlinVersion = "1.9.22"
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.8.0")
        classpath("com.facebook.react:react-native-gradle-plugin") 
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// This block executes for every sub-module (like react-native-screens)
// without waiting for the 'afterEvaluate' phase.
subprojects {
    project.plugins.configureEach {
        if (it.class.name.contains("AndroidBasePlugin")) {
            project.android {
                defaultConfig {
                    externalNativeBuild {
                        cmake {
                            // Using += to append the 16KB flags to existing arguments
                            arguments += ["-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,common-page-size=16384 -Wl,-z,max-page-size=16384"]
                        }
                    }
                }
            }
        }
    }
}
